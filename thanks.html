<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thanks — SoldFast</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F6F8;--card:#fff;--navy:#0F2A44;--ink:#1C2430;--muted:#5B6673;--line:#D9DFE7;--sold:#E0263C;--sold-dark:#B71C2E;--wa:#25D366}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:17px;line-height:1.55}
header{background:var(--card);border-bottom:1px solid var(--line)}
.nav{width:min(1120px,100% - 2.5rem);margin:auto;height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.45rem;color:var(--navy);text-decoration:none;letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem}
.logo b{background:var(--sold);color:#fff;padding:.05em .35em;border-radius:5px;transform:rotate(-4deg);display:inline-block}
.nav a.tel{font-weight:700;color:var(--navy);text-decoration:none}
main{flex:1;display:grid;place-items:center;padding:3rem 1.25rem}
.box{text-align:center;max-width:560px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2.8rem 2rem;box-shadow:0 18px 40px -20px rgba(15,42,68,.35)}
.tick{width:64px;height:64px;border-radius:50%;background:var(--sold);color:#fff;display:grid;place-items:center;margin:0 auto 1.2rem}
.tick svg{width:32px;height:32px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1.7rem,4.5vw,2.3rem);color:var(--navy);line-height:1.1;margin-bottom:.7rem}
p{color:var(--muted);margin:0 auto;max-width:40ch}
.btns{display:flex;justify-content:center;flex-wrap:wrap;gap:.7rem;margin-top:1.6rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;padding:.85rem 1.3rem;border-radius:10px;text-decoration:none}
.btn-sold{background:var(--sold);color:#fff}.btn-sold:hover{background:var(--sold-dark)}
.btn-wa{background:var(--wa);color:#063}
footer{text-align:center;color:var(--muted);font-size:.9rem;padding:1.5rem}
</style>
</head>
<body>
<header><div class="nav"><a class="logo" href="/"><span>Sold</span><b>Fast</b></a><a class="tel" href="tel:+27723886161">072 388 6161</a></div></header>
<main>
  <div class="box">
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Thanks — Werner will call you back.</h1>
    <p>Expect a call shortly during office hours, Monday to Friday, 09:00–17:00.</p>
    <div class="btns">
      <a class="btn btn-wa" href="https://wa.me/27723886161">Need us sooner? WhatsApp</a>
      <a class="btn btn-sold" href="/">Back to SoldFast</a>
    </div>
  </div>
</main>
<footer>SoldFast · Waterkloof Ridge, Pretoria</footer>
</body>
</html>
